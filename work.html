<div class="wrap">
<div class="page-head"><h1 class="play">Design work</h1><p class="lead">Click any piece to view it larger.</p></div>
<div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
<div class="gallery" id="gallery"></div>
</div>
<dialog id="box" aria-label="Image viewer"><div id="boxbody"></div><p id="boxcap"></p><div style="text-align:center"><button class="btn" id="close">Close</button></div></dialog>
<script>
/* HOW TO ADD YOUR IMAGES
   1. Upload your pictures into a folder named "images" in your GitHub repository.
   2. Add one line per image below. Example:
      {src:"images/my-poster.jpg", title:"Summer poster", cat:"Social media", ratio:"4/5"},
   - cat is the filter group (Social media, Branding, Video, UI/UX, or your own).
   - ratio is width/height of the image (4/5, 1/1, 16/9). Only used for placeholders.
   Lines with src:"" show a red placeholder until you add the file name. */
var works=[
 {src:"",title:"Social media post",cat:"Social media",ratio:"4/5"},
 {src:"",title:"Brand identity",cat:"Branding",ratio:"1/1"},
 {src:"",title:"Product campaign",cat:"Social media",ratio:"3/4"},
 {src:"",title:"Motion graphic",cat:"Video",ratio:"16/9"},
 {src:"",title:"App screen",cat:"UI/UX",ratio:"4/5"},
 {src:"",title:"Logo set",cat:"Branding",ratio:"1/1"}
];
var gal=document.getElementById('gallery'),fil=document.getElementById('filters'),box=document.getElementById('box');
function media(w,big){
  if(w.src){var i=document.createElement('img');i.src=w.src;i.alt=w.title;if(!big)i.loading='lazy';return i;}
  var d=document.createElement('div');d.className='ph';d.style.aspectRatio=w.ratio||'4/5';d.textContent=w.title;return d;
}
function draw(cat){
  gal.innerHTML='';
  works.filter(function(w){return cat==='All'||w.cat===cat;}).forEach(function(w){
    var b=document.createElement('button');b.className='glass shot';b.type='button';
    b.appendChild(media(w,false));
    var c=document.createElement('div');c.className='cap';c.innerHTML='<b></b> &middot; <span></span>';
    c.querySelector('b').textContent=w.title;c.querySelector('span').textContent=w.cat;b.appendChild(c);
    b.onclick=function(){var body=document.getElementById('boxbody');body.innerHTML='';body.appendChild(media(w,true));document.getElementById('boxcap').textContent=w.title+' · '+w.cat;box.showModal();};
    gal.appendChild(b);
  });
}
var cats=['All'].concat(works.map(function(w){return w.cat;}).filter(function(v,i,a){return a.indexOf(v)===i;}));
cats.forEach(function(c,i){
  var b=document.createElement('button');b.className='btn';b.type='button';b.textContent=c;b.setAttribute('aria-pressed',i===0);
  b.onclick=function(){Array.from(fil.children).forEach(function(x){x.setAttribute('aria-pressed','false');});b.setAttribute('aria-pressed','true');draw(c);};
  fil.appendChild(b);
});
draw('All');
document.getElementById('close').onclick=function(){box.close();};
box.addEventListener('click',function(e){if(e.target===box)box.close();});
</script>
